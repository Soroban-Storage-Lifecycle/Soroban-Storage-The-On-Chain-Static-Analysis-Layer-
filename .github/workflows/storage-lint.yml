# Fails developer builds on storage lint errors.
#
# Runs the storage linter over contract sources, builds the example contract
# for the Soroban wasm target, and executes the full test suite.
#
# Consumers: drop this file into your contract repository (adjusting
# `source-dir` / `contract-package`) or use the packaged action directly:
#
#   - uses: your-org/soroban-storage/.github/actions/soroban-storage-check@main
#     with:
#       source-dir: src
#       linter: crates.io        # or a git URL / `workspace`
name: storage-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  storage-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lints the example contract, fails on any error or warning, and builds
      # it for the Soroban wasm target.
      - uses: ./.github/actions/soroban-storage-check
        with:
          source-dir: crates/example-contract/src
          contract-package: example-contract
          linter: workspace

      # Full test suite (framework + example contract, on the host).
      - name: Run tests
        run: cargo test --workspace

      # Build the off-chain tools and exercise their CLIs. A usage error must
      # exit 2; an invalid contract id must fail cleanly (exit 1) before any
      # network call is made.
      - name: Build and smoke-test the off-chain tools
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p soroban-rent-keeper -p soroban-restore-planner
          ./target/debug/soroban-rent-keeper --help > /dev/null
          ./target/debug/soroban-restore-planner --help > /dev/null

          set +e
          ./target/debug/soroban-rent-keeper --bogus > /dev/null 2>&1
          keeper_usage=$?
          ./target/debug/soroban-restore-planner --bogus > /dev/null 2>&1
          planner_usage=$?
          ./target/debug/soroban-restore-planner \
            --contract not-a-strkey --rpc-url http://localhost \
            --network-passphrase Test > /dev/null 2>&1
          planner_bad_contract=$?
          set -e

          [ "$keeper_usage" -eq 2 ] || { echo "keeper usage exit $keeper_usage != 2"; exit 1; }
          [ "$planner_usage" -eq 2 ] || { echo "planner usage exit $planner_usage != 2"; exit 1; }
          [ "$planner_bad_contract" -eq 1 ] || { echo "planner bad-contract exit $planner_bad_contract != 1"; exit 1; }
          echo "off-chain CLI smoke tests OK"

      # Self-check: the linter must also stay clean on the framework sources
      # and the linter's own fixtures must keep flagging violations.
      - name: Self-lint framework sources
        run: cargo run -q -p soroban-storage-lints -- --deny-warnings crates/example-contract/src crates/soroban-storage/src