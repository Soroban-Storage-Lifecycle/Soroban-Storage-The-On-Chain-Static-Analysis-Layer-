[package]
name = "soroban-stellar-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Stellar XDR, strkey and signing helpers used by the soroban-storage tooling (rent keeper, restore planner)."
keywords = ["stellar", "soroban", "strkey", "xdr", "signing"]
categories = ["development-tools"]

[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
stellar-strkey = "0.0.16"
stellar-xdr = { version = "27.0.0", features = ["base64", "std"] }
