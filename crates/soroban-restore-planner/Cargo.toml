[package]
name = "soroban-restore-planner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Restore planner for archived Soroban contracts: given a contract, discovers archived entries via Stellar RPC and emits the RestoreFootprintOp transaction."
keywords = ["stellar", "soroban", "ttl", "restore", "cli"]
categories = ["development-tools"]

[[bin]]
name = "soroban-restore-planner"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soroban-stellar-common.workspace = true
stellar-rpc-client = "27.0.0"
stellar-xdr = { version = "27.0.0", features = ["base64", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
