[package]
name = "soroban-storage-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Procedural macros for soroban-storage: the `storage!` declaration macro and the `Critical` marker derive."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "printing", "proc-macro"] }