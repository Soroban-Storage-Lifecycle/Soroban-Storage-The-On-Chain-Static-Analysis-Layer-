[package]
name = "soroban-rent-keeper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rent keeper daemon for Soroban contracts: watches entry TTLs via Stellar RPC, computes eviction risk windows, and submits batched ExtendFootprintTTLOp transactions before eviction. Exposes Prometheus metrics."
keywords = ["stellar", "soroban", "ttl", "rent", "daemon"]
categories = ["development-tools"]

[[bin]]
name = "soroban-rent-keeper"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "2"
prometheus = "0.13"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
stellar-rpc-client = "27.0.0"
stellar-strkey = "0.0.16"
stellar-xdr = { version = "27.0.0", features = ["base64", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }