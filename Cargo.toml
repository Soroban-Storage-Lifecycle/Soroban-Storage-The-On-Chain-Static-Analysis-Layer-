[workspace]
resolver = "2"
members = [
    "crates/soroban-storage",
    "crates/soroban-storage-macros",
    "crates/soroban-storage-lints",
    "crates/example-contract",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
repository = "https://github.com/stellar/soroban-storage"
description = "Safe storage lifecycle framework for Soroban smart contracts: explicit lifecycle declarations, auto-bump TTLs on access, and compile-time protection for critical data."

[workspace.dependencies]
soroban-sdk = "27.0.6"
soroban-storage = { path = "crates/soroban-storage" }
soroban-storage-macros = { path = "crates/soroban-storage-macros" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1